<h2 class="text-xl font-semibold text-slate-900 mb-6">Escritorio</h2>

<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
  <div class="bg-white border border-slate-200 rounded-lg p-5">
    <p class="text-sm text-slate-500">Total de reportes</p>
    <p class="text-3xl font-bold text-slate-900">{{ total() }}</p>
  </div>

  <div class="bg-white border border-slate-200 rounded-lg p-5">
    <p class="text-sm text-slate-500">Pendientes</p>
    <p class="text-3xl font-bold text-amber-600">{{ pendientes() }}</p>
  </div>

  <div class="bg-white border border-slate-200 rounded-lg p-5">
    <p class="text-sm text-slate-500">Recogidos</p>
    <p class="text-3xl font-bold text-emerald-700">{{ recogidos() }}</p>
  </div>
</div>

<a routerLink="/reportes"
  class="inline-block px-4 py-2 bg-emerald-700 text-white text-sm font-medium rounded-md hover:bg-emerald-800">
  Reportar un residuo
</a>
