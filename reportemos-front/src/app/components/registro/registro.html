<div class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
  <div class="w-full max-w-sm bg-white border border-slate-200 rounded-xl shadow-sm p-6">
    <h1 class="text-2xl font-bold text-emerald-700">Reportemos</h1>
    <p class="text-sm text-slate-500 mb-6">Crea tu cuenta</p>

    @if (exito()) {
      <p class="text-sm text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-md p-3 mb-4">
        Cuenta creada. Ya puedes iniciar sesión.
      </p>
      <a routerLink="/login"
        class="block text-center w-full py-2 bg-emerald-700 text-white text-sm font-medium rounded-md hover:bg-emerald-800">
        Ir a iniciar sesión
      </a>
    } @else {
      <form (ngSubmit)="registrar()" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Nombre</label>
          <input type="text" name="nombre" [(ngModel)]="nombre"
            class="w-full px-3 py-2 border border-slate-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600" />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Correo</label>
          <input type="email" name="correo" [(ngModel)]="correo"
            class="w-full px-3 py-2 border border-slate-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600" />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Clave</label>
          <input type="password" name="clave" [(ngModel)]="clave"
            class="w-full px-3 py-2 border border-slate-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600" />
        </div>

        @if (error()) {
          <p class="text-sm text-red-600">{{ error() }}</p>
        }

        <button type="submit"
          class="w-full py-2 bg-emerald-700 text-white text-sm font-medium rounded-md hover:bg-emerald-800">
          Crear cuenta
        </button>
      </form>

      <p class="text-sm text-slate-500 text-center mt-4">
        ¿Ya tienes cuenta?
        <a routerLink="/login" class="text-emerald-700 font-medium hover:underline">Inicia sesión</a>
      </p>
    }
  </div>
</div>
