<div class="min-h-screen flex bg-slate-50">
  <aside class="w-60 bg-white border-r border-slate-200 flex flex-col">
    <div class="p-5 border-b border-slate-200">
      <h1 class="text-lg font-bold text-emerald-700">Reportemos</h1>
      <p class="text-xs text-slate-500">Hola, {{ auth.usuario()?.nombre }}</p>
    </div>

    <nav class="flex-1 p-3 space-y-1">
      <a routerLink="/escritorio" routerLinkActive="bg-emerald-50 text-emerald-700 font-medium"
        class="block px-3 py-2 rounded-md text-sm text-slate-700 hover:bg-slate-100">
        Escritorio
      </a>
      <a routerLink="/reportes" routerLinkActive="bg-emerald-50 text-emerald-700 font-medium"
        class="block px-3 py-2 rounded-md text-sm text-slate-700 hover:bg-slate-100">
        Mis reportes
      </a>

      <!-- Solo lo ve el admin -->
      @if (auth.esAdmin()) {
        <p class="px-3 pt-4 pb-1 text-xs font-semibold text-slate-400 uppercase">Administración</p>
        <a routerLink="/admin/reportes" routerLinkActive="bg-emerald-50 text-emerald-700 font-medium"
          class="block px-3 py-2 rounded-md text-sm text-slate-700 hover:bg-slate-100">
          Todos los reportes
        </a>
        <a routerLink="/admin/usuarios" routerLinkActive="bg-emerald-50 text-emerald-700 font-medium"
          class="block px-3 py-2 rounded-md text-sm text-slate-700 hover:bg-slate-100">
          Usuarios
        </a>
      }
    </nav>

    <button (click)="salir()"
      class="m-3 px-3 py-2 text-sm text-left text-red-600 rounded-md hover:bg-red-50">
      Salir
    </button>
  </aside>

  <!-- Aquí se pinta la página según la URL -->
  <main class="flex-1 p-6">
    <router-outlet />
  </main>
</div>
